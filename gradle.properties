# Gradle Properties
# 2G, not retroperf's 1G: the merged source set is 681 files / ~110k LOC (497 of them jextract
# output) and remapJar now rewrites 1486 classes plus 40 nested jars.
org.gradle.jvmargs = -Xmx2G
org.gradle.parallel = true

# Mod Properties
version = 0.1.5
maven_group = com.periut
archives_base_name = retrodragon

# Dependencies
retroconvert_version = 1.0.3
lwjgl_version = 3.4.0

# The two b1.7.3 content APIs. NEITHER is a runtime dependency of this mod: StationAPI is compile
# only (for the reload-screen compat mixins) and both are fetched on demand by the dev runs that
# install them -- ./gradlew runClientStapi and ./gradlew runClientRapi. See build.gradle.
stationapi_version = 2.0.0-alpha.6.2
retroapi_version = 0.3.5

# Staged alongside RetroAPI by runClientRapi -- it is a RetroAPI mod, so it cannot be installed on
# its own. Same non-transitive fetch as everything else there: its pom asks for starac and for
# retroapi 0.2.0, and it must get neither. See the note on the rapi entry in build.gradle.
retrocommands_version = 0.7.4

# Ornithe Related Dependencies - check https://ornithemc.net/develop for the latest versions
minecraft_version = b1.7.3
loader_version = 0.19.3

biny_mappings = 9859f76
client_raven_build = 2
server_raven_build = 2
client_sparrow_build = 2
server_sparrow_build = 2
biny_nests_build = 2

osl_version = 0.20.3

# WebGPU backend: jWebGPU's Dawn natives (NOT this project's version). Serves linux_x64, mac_x64
# and mac_arm64. Windows is NOT in that list -- see below.
dawn_version = 0.3.4

# WebGPU on Windows: webgpu_dawn.dll, because no jWebGPU Windows native can be used.
#
# The FFM bindings resolve wgpu* through SymbolLookup, which on Windows can only find symbols in the
# PE export table. NONE of jWebGPU's three Windows natives put the C API there -- the JNI build
# exports 1423 JNI stubs, the FFM build exports jParser's hashed wrappers, the C build exports teavm
# wrappers. All three link Dawn statically and export none of it, because MSVC exports nothing that
# is not explicitly marked. The Linux .so and macOS .dylib export all 263 by default ELF/Mach-O
# visibility, which is the only reason those platforms work. So Windows needs a Dawn DLL that does
# export the C API; downloadWindowsDawn in build.gradle fetches and verifies one.
#
# CURRENT SOURCE: mmozeiko/build-dawn, a third party, pending the first run of the
# "Dawn (Windows)" workflow. That build is 26.7 MB against jWebGPU's 5.5 MB (20.6 MB of .text
# against 3.85 MB) -- the extra is Tint's SPIR-V and GLSL shader-translation paths plus full RTTI,
# which a D3D12/HLSL target never executes. It is NOT a second backend: both Windows builds are
# D3D-only, neither contains a Vulkan or OpenGL backend (no vkGetInstanceProcAddr, no vulkan-1.dll,
# no WGL/EGL entry points in either binary), so -Dretrogpu.backendType=vulkan|opengl finds no
# adapter on Windows whichever of them is loaded.
#
# It is also a slightly newer Dawn than jWebGPU 0.3.4's -- so its 0x0005xxxx feature numbers have
# shifted and DawnFeatures exists to absorb that. Core WebGPU agrees exactly: 173 struct layouts
# identical, all standard constants identical.
#
# TO SWITCH to our own build (~5.5 MB, same Dawn as Linux/macOS, no third-party dependency, and
# DawnFeatures becomes deletable), run the workflow and then edit three lines here plus one
# constant -- see natives/dawn-windows/README.md. Nothing else changes.
#
# On any bump, re-run `./gradlew smokeTest featureProbe` on Windows, reconcile DawnFeatures against
# the printed feature list, and update DAWN_WINDOWS_TAG in WebGPUNatives to match dawn_windows_tag.
dawn_windows_tag = 2026-07-26
dawn_windows_url = https://github.com/mmozeiko/build-dawn/releases/download/2026-07-26/dawn-x64-2026-07-26.zip
# SHA-256 of whatever dawn_windows_url points at (.zip or bare .dll). A mismatch fails the build
# rather than warning: this is a binary fetched over the network and executed in-process.
dawn_windows_sha256 = d1a95ed1c7d869f4458958e1382297b56ff6b017342e67ea45bf59acc3ffaca7
