# Per-commit build check. Runs the plain `build` task and uploads build/libs as a CI artifact.
#
# `build` fetches NEITHER content API:
#
#   * RetroAPI is only ever resolved by stageRapiMods, which nothing in `build` depends on, and
#     retroconvert.localize() is called from inside a lazy FileCollection so it does not resolve at
#     configuration time either. Verified by building with a bogus retroapi_version: still succeeds.
#   * StationAPI is compiled against signature-only stubs in src/stapiStub -- see the README there.
#     `-Pstapi=real` uses the genuine artifact instead; the two produce byte-identical jars.
#
# That takes a cold-cache build from ~98s to ~8s, which is what a fresh clone pays. Loom's Minecraft
# remap is the remaining cost and lives under ~/.gradle/caches, which setup-gradle restores.
name: Build Check

on: [ pull_request, push ]

permissions:
  contents: read

# A force-push should not leave the superseded run burning a runner to no purpose.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the cache; branches and PRs read it. Without this every
          # PR writes its own entry and they evict each other, which turns the cache into overhead.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-libs
          path: build/libs/**/*
          if-no-files-found: error
