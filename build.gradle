// The other half of the picture: webgpuBench times the GEOMETRY, this times the FRAME. An empty
// frame's cost is the ceiling the renderer cannot exceed no matter how cheap drawing becomes, and
// it is invisible to every offscreen benchmark because it is made of acquire, submit, fence and
// present rather than triangles.
tasks.register('webgpuLoopBench', JavaExec) {
	group = 'verification'
	description = 'Frame-loop throughput against a real surface; empty frames, uncapped.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.periut.retrodragon.render.WebGpuLoopBench'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	if (macOs) {
		jvmArgs '-XstartOnFirstThread'
	}
	// Uncapped by default: the whole point is to measure the path the frame limiter is off on.
	// -Dretroperf.pacing=balanced still works for a vsync comparison.
	systemProperties System.getProperties().findAll { k, v -> forwarded(k) }
	if (!System.getProperties().containsKey('retroperf.pacing')) {
		systemProperty 'retroperf.pacing', 'max'
	}
}

