// A stub that reached a shipped jar would sit on the classpath ahead of the real StationAPI and
// break every mod that uses it, in a way that would look like StationAPI itself was broken. The
// source-set split already prevents it; this makes sure a future change to the jar tasks cannot
// quietly undo that.
def verifyNoStubsInJar = tasks.register('verifyNoStubsInJar') {
	group = 'verification'
	description = 'Fails if any net/modificationstation class is present in an output jar.'
	def jarFiles = layout.buildDirectory.dir('libs')
	doLast {
		def offenders = []
		jarFiles.get().asFile.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { file ->
			new java.util.zip.ZipFile(file).withCloseable { zip ->
				if (zip.entries().any { it.name.startsWith('net/modificationstation/') }) {
					offenders << file.name
				}
			}
		}
		if (offenders) {
			throw new GradleException("StationAPI compile stubs leaked into: ${offenders.join(', ')}."
				+ " They must never ship -- see src/stapiStub/java/net/modificationstation/README.md")
		}
	}
}

tasks.named('check') {
	dependsOn verifyNoStubsInJar
}
tasks.named('verifyNoStubsInJar') {
	dependsOn tasks.named('assemble')
}

// ---------------------------------------------------------------------------------------------
// Publishing, for companion mods built against the shader API.
//
// The REMAPPED jar, not the raw one: a consumer's Loom remaps a mod dependency from intermediary
// into its own mappings, and the raw jar carries named ones. Publishing that instead produces a
// dependency that compiles and then cannot find a single method at runtime.
//
// The pom carries the LWJGL 3 and Dawn coordinates even though the jar already NESTS them, because
// jar-in-jar reaches a production install and nothing else -- fabric-loader does not unpack nested
// jars in a development environment. Without these, a consumer's `./gradlew runClient` starts with
// zero org.lwjgl.* on the classpath and crashes in Minecraft.init. Both halves are needed: the pom
// for a dev run, the nesting for a shipped jar where there is no gradle to resolve anything.
// ---------------------------------------------------------------------------------------------
publishing {
	publications {
		mod(MavenPublication) {
			groupId = project.maven_group
			artifactId = project.archives_base_name
			version = project.version
			artifact(tasks.named('remapJar'))
			artifact(tasks.named('sourcesJar')) {
				classifier = 'sources'
			}

			pom.withXml {
				def deps = asNode().appendNode('dependencies')
				def add = { String group, String artifact, String ver, String classifier ->
					def d = deps.appendNode('dependency')
					d.appendNode('groupId', group)
					d.appendNode('artifactId', artifact)
					d.appendNode('version', ver)
					if (classifier) d.appendNode('classifier', classifier)
					d.appendNode('scope', 'runtime')
					return d
				}
				lwjglModules.each { module ->
					add('org.lwjgl', module, lwjglVersion, null)
					lwjglNativePlatforms.each { platform ->
						add('org.lwjgl', module, lwjglVersion, "natives-${platform}")
					}
				}
				dawnPlatforms.each { platform ->
					def d = add('com.github.xpenatan.jWebGPU', "webgpu-desktop-jni-dawn_${platform}",
						dawnVersion, null)
					// Same reason as the configurations.configureEach exclude above: jParser's
					// natives sit at the JAR ROOT, nothing here loads them, and root-level natives
					// are what collides. A consumer must not inherit them either.
					def ex = d.appendNode('exclusions').appendNode('exclusion')
					ex.appendNode('groupId', 'com.github.xpenatan.jParser')
					ex.appendNode('artifactId', '*')
				}
			}
		}
	}

	// Gradle Module Metadata would take precedence over the pom for gradle consumers, and it is
	// derived from the java component -- which this publication deliberately does not use, so it
	// would advertise the raw jar and none of the dependencies above. The pom is the only truth.
	tasks.withType(GenerateModuleMetadata).configureEach {
		enabled = false
	}
	repositories {
		mavenLocal()
	}
}

// Compiles a directory of WGSL against a real device -- the offline half of a shader check. A
// companion mod dumps its assembled programs and points this at them; see WgslCheck.
tasks.register('wgslCheck', JavaExec) {
	group = 'verification'
	description = 'Compiles every .wgsl in -Pdir=<directory> against a headless Dawn device.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.periut.retrodragon.gpu.WgslCheck'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	args = [project.findProperty('dir') ?: 'build/wgsl']
	systemProperties System.getProperties().findAll { k, v -> forwarded(k) }
}
